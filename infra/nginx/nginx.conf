# Serves the SPA and reverse-proxies the API. SSE settings are critical — see docs/components/07-infra.md §5.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;            # critical: stream SSE, don't buffer
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA history fallback
    }
}
