# Single-command setup — see docs/components/07-infra.md.
# Usage: cp .env.example .env  (paste an API key)  ->  docker-compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refund}
      POSTGRES_DB: ${POSTGRES_DB:-refund}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-refund}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports: ["5432:5432"]   # opt-in for local DB inspection

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-refund}:${POSTGRES_PASSWORD:-refund}@db:5432/${POSTGRES_DB:-refund}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
