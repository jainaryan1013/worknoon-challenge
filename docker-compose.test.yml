# Dockerized test stack — see docs/components/07 + the testing plan.
# Ephemeral Postgres on tmpfs (wiped every run), a one-shot pytest runner.
# Usage: make test   (or: docker compose -f docker-compose.test.yml up --build
#                          --abort-on-container-exit --exit-code-from test)
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: refund
      POSTGRES_PASSWORD: refund
      POSTGRES_DB: refund_test
    tmpfs:
      - /var/lib/postgresql/data   # in-memory: fast, no volume, gone on teardown
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refund -d refund_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      dockerfile: infra/docker/test.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://refund:refund@db-test:5432/refund_test
      SEED_ENABLED: "false"
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app          # live source + write generated migrations back
    working_dir: /app
    command: ["pytest", "-q"]
